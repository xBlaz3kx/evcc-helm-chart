{{- if and .Values.persistence.enabled .Values.persistence.backup.enabled .Values.persistence.backup.metrics.enabled .Values.persistence.backup.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "evcc.fullname" . }}-litestream
  labels:
    {{- include "evcc.labels" . | nindent 4 }}
    {{- with .Values.persistence.backup.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "evcc.selectorLabels" . | nindent 6 }}
      component: litestream
  endpoints:
    - port: metrics
      interval: {{ .Values.persistence.backup.metrics.serviceMonitor.interval }}
      path: /metrics
{{- end }}
